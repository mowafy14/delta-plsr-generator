<title>مولّد كود PLSR – دلتا DVP</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5f4;--card:#fff;--ink:#1b2422;--mute:#5d6b67;--line:#d5dcda;--acc:#0b7a5c;--acc2:#e8f4ef;--warn:#9a5b00;--warnbg:#fff3dc;--err:#a62b2b;--errbg:#fde9e9;--code:#10201c;--codeink:#c9f3e2;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121816;--card:#1a2320;--ink:#e6efec;--mute:#93a5a0;--line:#2c3935;--acc:#3ecf9f;--acc2:#183128;--warn:#f1b955;--warnbg:#3a2e15;--err:#ff8d8d;--errbg:#3b1d1d;--code:#0a110f;--codeink:#b6f0d8}}
:root[data-theme="dark"]{--bg:#121816;--card:#1a2320;--ink:#e6efec;--mute:#93a5a0;--line:#2c3935;--acc:#3ecf9f;--acc2:#183128;--warn:#f1b955;--warnbg:#3a2e15;--err:#ff8d8d;--errbg:#3b1d1d;--code:#0a110f;--codeink:#b6f0d8}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Cairo,Tahoma,sans-serif;line-height:1.7}
.wrap{max-width:1040px;margin:0 auto;padding:20px 14px 48px}
.hd{display:flex;align-items:center;gap:16px;margin-bottom:6px}
.logo{width:150px;height:auto;border-radius:14px;flex:none}
@media(max-width:520px){.hd{flex-direction:column;align-items:flex-start}.logo{width:130px}}
h1{font-size:1.6rem;margin:6px 0 2px}
.sub{color:var(--mute);margin:0 0 18px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:820px){.grid{grid-template-columns:1fr}}
fieldset{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px 14px;margin:0 0 14px}
legend{font-weight:700;padding:0 8px;color:var(--acc)}
label{display:block;font-size:.92rem;margin:8px 0 2px}
.hint{font-size:.8rem;color:var(--mute);margin:0 0 2px}
input,select{width:100%;font:inherit;padding:7px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus,select:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chk{display:flex;gap:8px;align-items:flex-start;margin:10px 0 2px}
.chk input{width:auto;margin-top:7px}
.sub-box{border-inline-start:3px solid var(--acc);padding-inline-start:10px;margin-top:6px}
.hide{display:none}
.out{position:sticky;top:12px;align-self:start}
pre{direction:ltr;text-align:left;background:var(--code);color:var(--codeink);padding:14px;border-radius:10px;overflow-x:auto;margin:0 0 10px;font:13px/1.65 ui-monospace,Consolas,monospace;white-space:pre}
.tabs{display:flex;gap:6px;margin-bottom:8px}
.tabs button,.copy{font:inherit;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:6px 14px;border-radius:8px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--acc);color:#fff;border-color:var(--acc)}
.copy{background:var(--acc2);border-color:var(--acc);color:var(--ink)}
.msg{padding:8px 12px;border-radius:8px;margin:0 0 8px;font-size:.9rem}
.w{background:var(--warnbg);color:var(--warn)}
.e{background:var(--errbg);color:var(--err)}
.ex{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 14px;font-size:.9rem}
.ex b{color:var(--acc)}
</style>
</head>

<script>
const $=id=>document.getElementById(id);
const CH={
Y0:{ch:0,mode:'D1220',sf:'D1340',dflag:'M1534',ddev:'D1348',fix:'M1604',fmax:'D1410',mk:'M1156',mkp:'D1232',fr:'D1026',bk:'D1100',pnow:'M1078',pramp:'M1108',done:'M1029',inp:'X4'},
Y1:{ch:0,mode:'D1220',sf:null,dflag:null,ddev:null,fix:'M1606',fmax:'D1988',mk:'M1157',mkp:'D1236',fr:'D1154',bk:'D1156',pnow:'M1079',pramp:'M1109',done:'M1030',inp:'X5'},
Y2:{ch:1,mode:'D1221',sf:'D1352',dflag:'M1535',ddev:'D1349',fix:'M1605',fmax:'D1412',mk:'M1158',mkp:'D1234',fr:'D1135',bk:'D1102',pnow:'M1104',pramp:'M1110',done:'M1102',inp:'X6'},
Y3:{ch:1,mode:'D1221',sf:null,dflag:null,ddev:null,fix:'M1607',fmax:'D1990',mk:'M1159',mkp:'D1238',fr:'D1158',bk:'D1160',pnow:'M1105',pramp:'M1111',done:'M1103',inp:'X7'}};
let view='IL',init=[],ildata=[],lddata=[];
const n=id=>parseInt($(id).value,10);
const K=v=>'K'+v;
function build(){
  const o=$('out').value,c=CH[o],b=$('bits').value==='32',D=b?'D':'';
  const isY02=(o==='Y0'||o==='Y2'),pd=$('dir').value==='pd';
  const msgs=[];
  let s1=n('s1'),s2=n('s2'),s3=n('s3');
  const maxF=c.ch===1&&(o==='Y1'||o==='Y3')?10000:(b?100000:32767);
  const maxP=b?2147483647:32767;
  if(isNaN(s1)||isNaN(s2)||isNaN(s3)){$('code').textContent='املا القيم الأساسية الأول.';return}
  if(s1<6){msgs.push(['w','السرعة أقل من 6Hz، الـ PLC هيخرج 6Hz.']);}
  if(s1>maxF){msgs.push(['w','السرعة أكبر من الحد الأقصى ('+maxF+'Hz) لـ '+o+'، الـ PLC هيخرج الحد الأقصى.'])}
  if(s3<20){msgs.push(['e','S3 لازم يكون 20ms أو أكتر.'])}
  if(s2===0){msgs.push(['e','عدد النبضات لازم يكون 1 أو أكتر.'])}
  let s2v=Math.abs(s2);
  if(s2v>maxP){msgs.push(['w','عدد النبضات أكبر من حد الـ '+(b?'32':'16')+'-bit ('+maxP+'). غيّر النوع لـ 32-bit.'])}
  const rev=pd&&$('rev').value==='r';
  if(rev)s2v=-s2v;
  $('revbox').classList.toggle('hide',!pd);
  if(!pd&&(o==='Y1'||o==='Y3'))msgs.push(['w','في وضع Pulse فقط، '+o+' بيطلع نبضات على مخرجه هو.']);
  if(pd&&(o==='Y1'||o==='Y3'))msgs.push(['w','في وضع Pulse/Dir، '+(o==='Y1'?'Y0':'Y2')+' هو اللي بيطلع النبضات و'+o+' اتجاه. استخدم '+(o==='Y1'?'Y0':'Y2')+' كمخرج نبضات.']);
  if(!pd&&rev)s2v=Math.abs(s2v);
  $('sf').disabled=!c.sf;
  $('sflab').textContent=c.sf?'تردد البداية/النهاية (Hz) – '+c.sf:'تردد البداية/النهاية – ثابت 0Hz لـ '+o;
  $('sep').disabled=!isY02;$('scurve').disabled=!isY02;
  if(!isY02){$('sep').checked=false;$('scurve').checked=false}
  $('sepbox').classList.toggle('hide',!$('sep').checked);
  $('fixbox').classList.toggle('hide',!$('fix').checked);
  $('markbox').classList.toggle('hide',!$('mark').checked);
  init=[];
  const dm=(d,v)=>init.push(['DMOV',K(v),d]);
  if(pd||true){init.push(['MOV',pd?'K1':'K0',c.mode])}
  if(c.sf&&$('sf').value!==''){init.push(['MOV',K(n('sf')),c.sf])}
  if($('sep').checked&&isY02){
    const dv=n('decel');
    if(dv<20||dv>32767)msgs.push(['e','زمن التباطؤ لازم بين 20 و32767ms.']);
    init.push(['SET',c.dflag]);init.push(['MOV',K(dv),c.ddev]);
  }
  if($('scurve').checked&&isY02)init.push(['SET','M1257']);
  if($('fix').checked){
    const fm=n('fmax');
    if(fm<s1)msgs.push(['w','أقصى تردد للميل أقل من السرعة المطلوبة، خليه أكبر أو يساويها.']);
    init.push(['SET',c.fix]);init.push(['DMOV',K(fm),c.fmax]);
  }
  if($('mark').checked){
    const mp=n('mp'),fr=n('fm')||0,bk=n('bm')||0;
    if(mp<=0)msgs.push(['e','نبضات الوقوف بعد العلامة لازم أكبر من 0 (0 يعطّل الوظيفة).']);
    if(mp>Math.abs(s2v)/2)msgs.push(['w','نبضات الوقوف أكبر من نص إجمالي النبضات، الـ PLC هيقللها تلقائياً.']);
    if(!$('sep').checked&&isY02)msgs.push(['w','مع الـ Mark، زمن التباطؤ بيتحدد من '+c.ddev+'. فعّل "زمن تباطؤ مختلف" وحدده.']);
    if(!isY02)msgs.push(['w','الـ Mark مع '+o+' يحتاج موديل وفيرموير أحدث (راجع جدول الـ Firmware).']);
    init.push(['SET',c.mk]);init.push(['DMOV',K(mp),c.mkp]);
    if(fr>0)init.push(['DMOV',K(fr),c.fr]);
    if(bk>0)init.push(['DMOV',K(bk),c.bk]);
    msgs.push(['w','ملحوظة: إشارة '+c.inp+' لازم تكون موصلة، ولو بتستخدم Interrupt استخدم برنامج المقاطعة المناسب.']);
  }
  const trig=$('trig').value||'X0';
  const plsr=[D+'PLSR',K(s1),K(s2v),K(s3),o];
  const pause=$('ps').value,pc=$('pc').value||'X2';
  const pdev=pause==='now'?c.pnow:pause==='ramp'?c.pramp:null;
  // IL
  const L=[];
  L.push('// أول Scan (إعدادات مرة واحدة)');
  L.push('LD  M1002');
  init.forEach((r,i)=>{L.push((r[0]==='SET'?'SET ':r[0]==='DMOV'?'DMOV ':'MOV ')+' '+r.slice(1).join(' '))});
  L.push('');L.push('// التشغيل (اترك الشرط ON لحد الاكتمال)');
  L.push('LD  '+trig);L.push(plsr.join(' '));
  if(pdev){L.push('');L.push('// إيقاف مؤقت');L.push('LD  '+pc);L.push('OUT '+pdev)}
  L.push('');L.push('// اكتمال الحركة: '+c.done+' = ON');
  ildata=L.join('\n');
  // LD
  const D2=[];
  D2.push('M1002 (أول Scan)');
  D2.push('|--┤ ├──┬─[ '+(init[0]?init[0].join(' '):'')+' ]');
  for(let i=1;i<init.length;i++)D2.push('|         ├─[ '+init[i].join(' ')+' ]');
  D2.push('|');
  D2.push(trig.padEnd(4)+' ');
  D2.push('|--┤ ├────[ '+plsr.join(' ')+' ]');
  if(pdev){D2.push('|');D2.push(pc+'');D2.push('|--┤ ├────( '+pdev+' )')}
  D2.push('|');D2.push('|--[ END ]');
  lddata=D2.join('\n');
  $('code').textContent=view==='IL'?ildata:lddata;
  $('msgs').innerHTML=msgs.map(m=>'<div class="msg '+m[0]+'">'+m[1]+'</div>').join('');
  // explanation
  const acc=Math.round(s3/20),step=(s1/20).toFixed(1);
  let t='<b>الملخص:</b> '+o+' هيخرج '+Math.abs(s2v)+' نبضة بسرعة '+s1+'Hz. ';
  t+='التسارع على 20 درجة، كل درجة تزود '+step+'Hz وتاخد '+(s3/20).toFixed(1)+'ms. ';
  if(pd)t+='الاتجاه: '+(rev?'عكسي':'أمامي')+' ('+c.mode+' = K1). ';
  t+='لازم '+trig+' يفضل ON لحد ما '+c.done+' يشتغل.';
  $('expl').innerHTML=t;
}
document.querySelectorAll('input,select').forEach(e=>e.addEventListener('input',build));
$('tIL').onclick=()=>{view='IL';$('tIL').setAttribute('aria-pressed','true');$('tLD').setAttribute('aria-pressed','false');build()};
$('tLD').onclick=()=>{view='LD';$('tLD').setAttribute('aria-pressed','true');$('tIL').setAttribute('aria-pressed','false');build()};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText($('code').textContent);$('copy').textContent='تم النسخ'}catch(e){const r=document.createRange();r.selectNodeContents($('code'));const s=getSelection();s.removeAllRanges();s.addRange(r);$('copy').textContent='حدد الكود وانسخه'}setTimeout(()=>$('copy').textContent='نسخ الكود',1500)};
build();
</script>
</body>
</html>
